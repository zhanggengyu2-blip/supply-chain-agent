[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: 使用预设响应的模型执行结果可复现的单元测试，以及通过实际运行图执行的测试
    mock_erp: 使用模拟 ERPNext 响应的 HTTP 和 MCP 测试
    integration: 需显式启用的 ERPNext 接口测试，使用真实凭据进行只读查询
    persistence: 需显式启用的 Agent MongoDB 集成测试，仅访问 Agent 数据库
