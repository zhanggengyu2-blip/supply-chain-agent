[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: deterministic unit and real runtime graph tests with scripted models
    mock_erp: HTTP/MCP tests against simulated ERPNext responses
    integration: opt-in real authenticated read-only ERPNext API tests
    persistence: opt-in real Agent MongoDB integration (never ERP database)
