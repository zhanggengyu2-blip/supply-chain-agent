name: supply-chain-agent-phase1
services:
  mongo:
    image: mongo:7.0.16
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - agent_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  agent_mongo:
